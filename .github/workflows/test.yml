name: Run Unit Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DryCleaning.slnx

      - name: Build
        run: dotnet build DryCleaning.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DryCleaning.slnx --no-build --configuration Release --verbosity normal